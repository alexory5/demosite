<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Барбершоп «Север» — Якутск</title>
<meta name="description" content="Мужские стрижки и уход за бородой в Якутске. Цены, адрес, онлайн-заявка.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAEFF2; --ink:#12303B; --muted:#4F6670; --line:#B9C7CE;
  --accent:#B3262E; --paper:#F8FAFB;
  --display:"Unbounded","Arial Black",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}

/* hero with barber-pole edge */
.hero{position:relative;padding:72px 0 64px 0;background:var(--ink);color:#F2F6F8;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;
  background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,#F2F6F8 14px 28px,#2D5BA8 28px 42px,#F2F6F8 42px 56px)}
.hero .wrap{padding-left:56px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,68px);line-height:1.05;letter-spacing:-.01em;max-width:14ch}
.hero p{margin-top:20px;font-size:19px;max-width:44ch;color:#C9D8DF}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-block;padding:14px 24px;border-radius:6px;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;font:inherit;font-weight:700}
.btn-main{background:var(--accent);color:#fff}
.btn-main:hover{background:#951E25}
.btn-ghost{border-color:#7E97A2;color:#F2F6F8}
.btn-ghost:hover{border-color:#F2F6F8}

section{padding:64px 0}
h2{font-family:var(--display);font-weight:600;font-size:clamp(24px,4vw,34px);margin-bottom:28px;line-height:1.2}

/* price list */
.prices{list-style:none;max-width:640px}
.prices li{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.prices .name{font-weight:500}
.prices .note{color:var(--muted);font-size:14px;margin-left:8px}
.prices .fill{flex:1}
.prices .price{font-weight:700;white-space:nowrap}

/* contacts */
.contacts{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px}
.grid dt{font-weight:700;margin-bottom:4px}
.grid dd{color:var(--muted)}
.grid a{color:var(--ink);font-weight:500}

/* form */
form{max-width:560px;display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:500;font-size:15px}
input,select,textarea{font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(18,48,59,.18)}
textarea{min-height:90px;resize:vertical}
.hint{font-size:14px;color:var(--muted)}
.status{padding:14px 16px;border-radius:6px;font-weight:500;display:none}
.status.ok{display:block;background:#DDEFE3;color:#1D5B32}
.status.err{display:block;background:#F6DCDD;color:#8B1D24}
button[disabled]{opacity:.6;cursor:wait}

footer{padding:28px 0;color:var(--muted);font-size:14px}

@media (max-width:560px){
  .hero{padding:48px 0 44px}
  .hero .wrap{padding-left:44px}
  section{padding:48px 0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1 id="biz-name"></h1>
    <p id="biz-tagline"></p>
    <div class="actions">
      <a class="btn btn-main" href="#zayavka">Оставить заявку</a>
      <a class="btn btn-ghost" id="wa-link" href="#" target="_blank" rel="noopener">Написать в WhatsApp</a>
    </div>
  </div>
</header>

<main>
  <section id="uslugi">
    <div class="wrap">
      <h2>Услуги и цены</h2>
      <ul class="prices" id="price-list"></ul>
    </div>
  </section>

  <section class="contacts" id="kontakty">
    <div class="wrap">
      <h2>Как нас найти</h2>
      <dl class="grid">
        <div><dt>Адрес</dt><dd id="c-address"></dd><dd><a id="c-map" href="#" target="_blank" rel="noopener">Открыть на карте</a></dd></div>
        <div><dt>Часы работы</dt><dd id="c-hours"></dd></div>
        <div><dt>Телефон</dt><dd><a id="c-phone" href="#"></a></dd></div>
      </dl>
    </div>
  </section>

  <section id="zayavka">
    <div class="wrap">
      <h2>Оставьте заявку</h2>
      <form id="lead-form" novalidate>
        <label>Ваше имя
          <input name="name" type="text" autocomplete="name" required>
        </label>
        <label>Телефон
          <input name="phone" type="tel" autocomplete="tel" placeholder="+7 ___ ___-__-__" required>
        </label>
        <label>Услуга
          <select name="service" id="service-select"></select>
        </label>
        <label>Удобное время
          <input name="when" type="text" placeholder="Например, завтра после 18:00">
        </label>
        <label>Комментарий
          <textarea name="comment"></textarea>
        </label>
        <button class="btn btn-main" type="submit" id="submit-btn">Отправить заявку</button>
        <p class="hint">Мы перезвоним или напишем в WhatsApp, чтобы подтвердить время.</p>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" id="footer-text"></div>
</footer>

<script>
/* ============================================================
   НАСТРОЙКИ — меняйте только этот блок под каждого клиента
   ============================================================ */
const CONFIG = {
  name: "Барбершоп «Север»",
  tagline: "Мужские стрижки и уход за бородой в центре Якутска. Запись на удобное время.",
  phone: "+7 914 000-00-00",            // для звонка
  whatsapp: "79969158443",               // только цифры, с кодом страны, без «+»
  address: "г. Якутск, ул. Примерная, 1",
  mapUrl: "https://2gis.ru/yakutsk",     // ссылка на карточку в 2ГИС
  hours: "Ежедневно, 10:00–21:00",
  services: [
    { name: "Мужская стрижка",       price: "1 500 ₽", note: "45 мин" },
    { name: "Оформление бороды",     price: "1 000 ₽", note: "30 мин" },
    { name: "Стрижка + борода",      price: "2 300 ₽", note: "1 ч 15 мин" },
    { name: "Детская стрижка",       price: "1 000 ₽", note: "до 12 лет" },
    { name: "Бритьё опасной бритвой",price: "1 200 ₽" }
  ],
  // Куда отправлять заявки. Вставьте сюда адрес Webhook из n8n (метод POST).
  // Пока пусто — заявка откроет WhatsApp с готовым текстом.
  webhookUrl: ""
};
/* ============================================================ */

const $ = (id) => document.getElementById(id);

// заполняем страницу из настроек
document.title = CONFIG.name + " — Якутск";
$("biz-name").textContent = CONFIG.name;
$("biz-tagline").textContent = CONFIG.tagline;
$("wa-link").href = "https://wa.me/" + CONFIG.whatsapp;
$("c-address").textContent = CONFIG.address;
$("c-map").href = CONFIG.mapUrl;
$("c-hours").textContent = CONFIG.hours;
$("c-phone").textContent = CONFIG.phone;
$("c-phone").href = "tel:" + CONFIG.phone.replace(/[^\d+]/g, "");
$("footer-text").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;

const list = $("price-list");
const select = $("service-select");
CONFIG.services.forEach((s) => {
  const li = document.createElement("li");
  const n = document.createElement("span"); n.className = "name"; n.textContent = s.name;
  if (s.note) { const no = document.createElement("span"); no.className = "note"; no.textContent = s.note; n.appendChild(no); }
  const f = document.createElement("span"); f.className = "fill";
  const p = document.createElement("span"); p.className = "price"; p.textContent = s.price;
  li.append(n, f, p); list.appendChild(li);

  const o = document.createElement("option"); o.value = s.name; o.textContent = s.name + " — " + s.price;
  select.appendChild(o);
});

// отправка заявки
const form = $("lead-form");
const statusBox = $("status");
const btn = $("submit-btn");

function showStatus(type, text) {
  statusBox.className = "status " + type;
  statusBox.textContent = text;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  const digits = (data.phone || "").replace(/\D/g, "");

  if (!data.name.trim()) { showStatus("err", "Укажите имя."); return; }
  if (digits.length < 10) { showStatus("err", "Проверьте номер телефона: нужно минимум 10 цифр."); return; }

  data.source = location.href;
  data.sentAt = new Date().toISOString();

  btn.disabled = true;
  try {
    if (CONFIG.webhookUrl) {
      const r = await fetch(CONFIG.webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      form.reset();
      showStatus("ok", "Заявка отправлена. Мы свяжемся с вами в ближайшее время.");
    } else {
      // запасной вариант: открываем WhatsApp с готовым сообщением
      const text = "Здравствуйте! Меня зовут " + data.name + ". Хочу записаться: " + data.service +
        (data.when ? ", " + data.when : "") + ". Телефон: " + data.phone +
        (data.comment ? ". " + data.comment : "");
      window.open("https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(text), "_blank");
      showStatus("ok", "Открываем WhatsApp, чтобы отправить заявку.");
    }
  } catch (err) {
    showStatus("err", "Не удалось отправить заявку. Позвоните нам: " + CONFIG.phone);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
